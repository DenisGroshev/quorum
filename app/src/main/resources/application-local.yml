quorum:
  auth:
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-secret-please-change}
  telegram:
    bot-token: ${TG_BOT_TOKEN:dev-bot-token}
    bot-username: ${TG_BOT_USERNAME:quorum_dev_bot}
    miniapp-name: ${TG_APP_NAME:quorum-dev}
  tmdb:
    api-token: ${TMDB_TOKEN:dev-tmdb-token}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:quorum}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration

logging:
  level:
    app.quorum: DEBUG
    org.flywaydb: DEBUG