services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quorum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - quorum-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quorum"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: quorum
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-only-insecure-secret-please-change
      TG_BOT_TOKEN: dev-bot-token
      TG_APP_NAME: quorum-dev
      TMDB_TOKEN: dev-tmdb-token
    ports:
      - "8080:8080"

volumes:
  quorum-db-data:
